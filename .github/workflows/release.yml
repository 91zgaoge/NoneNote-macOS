name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, e.g. 1.0.1'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Work out the version
        id: v
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION"    >> "$GITHUB_OUTPUT"
          # a monotonic build number Sparkle can compare
          echo "build=$(git rev-list --count HEAD)" >> "$GITHUB_OUTPUT"

      - name: Fetch Sparkle
        run: ./scripts/fetch-sparkle.sh

      # Notarization needs all six. Checked up front so a release fails before it
      # has spent ten minutes building, rather than publishing a DMG that
      # Gatekeeper refuses on every machine that downloads it.
      - name: Check the signing secrets
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          missing=()
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD \
                      APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            [ -n "${!name:-}" ] || missing+=("$name")
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Missing repository secret(s): ${missing[*]}"
            echo "Add them under Settings → Secrets and variables → Actions."
            echo "The names are the ones StoryMoss passes to tauri-action."
            exit 1
          fi
          echo "✓ all signing secrets present"

      - name: Build, sign and notarize
        env:
          MARKETING_VERSION: ${{ steps.v.outputs.version }}
          BUILD_NUMBER: ${{ steps.v.outputs.build }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: ./scripts/release-macos.sh "${{ steps.v.outputs.version }}"

      - name: Sign the update and write the appcast
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          VERSION: ${{ steps.v.outputs.version }}
          BUILD: ${{ steps.v.outputs.build }}
        run: |
          if [ -z "$SPARKLE_PRIVATE_KEY" ]; then
            echo "::error::SPARKLE_PRIVATE_KEY secret is not set — updates cannot be signed."
            exit 1
          fi
          KEYFILE="$(mktemp)"
          printf '%s' "$SPARKLE_PRIVATE_KEY" > "$KEYFILE"
          echo "key bytes: $(wc -c < "$KEYFILE")"
          test -x ./Sparkle/bin/sign_update
          NOTES="$(git log -1 --pretty=%B | python3 -c 'import html,sys; print("<p>"+html.escape(sys.stdin.read().strip()).replace(chr(10),"<br>")+"</p>")')" \
          ./scripts/make-appcast.sh \
            "build/NoneNote-${VERSION}.dmg" \
            "$KEYFILE" \
            "https://github.com/${GITHUB_REPOSITORY}/releases/download/${{ steps.v.outputs.tag }}/NoneNote-${VERSION}.dmg"
          rm -f "$KEYFILE"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="${{ steps.v.outputs.version }}"
          # A stable filename as well, so the website's download link never has to
          # be edited. Sparkle keeps using the versioned one named in the appcast.
          cp "build/NoneNote-${V}.dmg" build/NoneNote.dmg
          gh release create "${{ steps.v.outputs.tag }}" \
            "build/NoneNote-${V}.dmg" build/NoneNote.dmg \
            --title "NoneNote ${V}" \
            --generate-notes \
            --latest || \
          gh release upload "${{ steps.v.outputs.tag }}" \
            "build/NoneNote-${V}.dmg" build/NoneNote.dmg --clobber

      - name: Commit the appcast so Sparkle can see the update
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add appcast.xml
          if git diff --cached --quiet; then
            echo "appcast unchanged"
          else
            git commit -m "Release ${{ steps.v.outputs.version }}: update appcast"
            git push origin HEAD:main
          fi
