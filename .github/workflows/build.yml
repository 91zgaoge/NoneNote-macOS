name: Build

on:
  push:
    branches: [main]
    paths-ignore: ['site/**', 'appcast.xml', '**/*.md']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Fetch Sparkle
        run: ./scripts/fetch-sparkle.sh

      - name: Build
        run: ./build.sh release

      - name: Verify the bundle
        run: |
          # build.sh also drops a `Noty.app` symlink next to the real bundle, and
          # upload-artifact does not follow symlinks — so resolve the bundle
          # itself rather than uploading a link that arrives dangling.
          APP="$(ls -d build/NoneNote-*.app)"
          test -n "$APP"
          test -x "$APP/Contents/MacOS/Noty"
          codesign --verify --deep --strict "$APP"
          /usr/libexec/PlistBuddy -c "Print :SUFeedURL" "$APP/Contents/Info.plist"
          otool -L "$APP/Contents/MacOS/Noty" | grep -q Sparkle

      - uses: actions/upload-artifact@v4
        with:
          name: NoneNote-app
          path: build/NoneNote-*.app
